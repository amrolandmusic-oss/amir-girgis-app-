publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.42
  just_audio_background: ^0.0.1-beta.15
  audio_service: ^0.18.15
